name: Fixed historical Docker restart diagnostics (ca8bc7a6)

on:
  push:
    branches:
      - codex/bundle8b-physical-eol-001
    paths:
      - internal/hostruntime/docker_port_daemon_smoke_linux_test.go
      - internal/hostruntime/docker_port_smoke_diagnostics_linux_test.go
      - .github/workflows/docker-restart-diagnostics.yml
      - scripts/ci/historical_diagnostic_guard.py
      - scripts/ci/check_historical_diagnostic_fixtures.py

permissions:
  contents: read

concurrency:
  group: docker-restart-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  GOMAXPROCS: "2"
  GOTOOLCHAIN: local
  U_APP: 794d0cd69dd1b3ca130101f7769aaf8ac1274ac8
  B_WORKFLOW: b7ea27bb503bf259abeb34652b41cce9351884d2
  D_PREVIOUS: b123456f33f0c61974bb3300dfd59b909646404a
  W_BASE: 2cc44bcbad857a103aa58cb30e89f97dcda8ffda
  HISTORICAL_SOURCE_SHA: ca8bc7a696f14efd7c16d5f26b7895ac56ad7262
  DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  docker-restart-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: historical-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          persist-credentials: false
          fetch-depth: 0
          clean: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HISTORICAL_SOURCE_SHA }}
          path: historical-source
          persist-credentials: false
          fetch-depth: 0
          clean: false
      - name: Guard fixed historical source and actual workflow identity
        id: source-guard
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow-source/scripts/ci/historical_diagnostic_guard.py \
            --source-root . --workflow-root ../workflow-source
      - name: Preserve all 30 historical source guard fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow-source/scripts/ci/check_historical_diagnostic_fixtures.py \
            --source-root . \
            --fixture-root "${RUNNER_TEMP}/historical-guard-fixtures" \
            --out "${RUNNER_TEMP}/docker-restart-diagnostics/guard-fixtures.json"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: historical-source/go.mod
          cache-dependency-path: historical-source/go.sum
      - name: Run diagnostic helper tests once without root or Docker
        id: helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/docker-restart-diagnostics/helpers"
          go test -json -p 1 ./internal/hostruntime \
            -run '^TestDockerSmokeDiagnostic' -count=1 -timeout=3m \
            > "${RUNNER_TEMP}/docker-restart-diagnostics/helpers/helpers.json"
      - name: Require helper execution and skip zero
        if: always() && steps.source-guard.outcome == 'success' && steps.helpers.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          source = Path("internal/hostruntime/docker_port_smoke_diagnostics_linux_test.go").read_text(encoding="utf-8")
          names = re.findall(r"^func (TestDockerSmokeDiagnostic[A-Za-z0-9_]+)\s*\(", source, re.MULTILINE)
          target = Path(os.environ["RUNNER_TEMP"]) / "docker-restart-diagnostics/helper-tests.txt"
          target.write_text("\n".join(names) + "\n", encoding="utf-8")
          PY
          bash scripts/ci/verify-go-test-evidence.sh \
            "${RUNNER_TEMP}/docker-restart-diagnostics/helpers" \
            "${GITHUB_WORKSPACE}/historical-source/internal/hostruntime" \
            "${RUNNER_TEMP}/docker-restart-diagnostics/helper-tests.txt"
      - name: Build bounded Docker fixture binaries from guarded source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others)"
          mkdir -p "${RUNNER_TEMP}/docker-restart-diagnostics/daemon"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -p 1 -trimpath \
              -o "${RUNNER_TEMP}/docker-port-fixture" \
              ./internal/hostruntime/testdata/docker-port-fixture
          go test -c -p 1 ./internal/hostruntime \
            -o "${RUNNER_TEMP}/hostruntime-docker.test"
          sudo install -d -o root -g root -m 0755 /usr/local/libexec
          sudo install -m 0755 "${RUNNER_TEMP}/docker-port-fixture" \
            /usr/local/libexec/autostream-docker-port-fixture-ci
          sudo install -m 0755 "${RUNNER_TEMP}/hostruntime-docker.test" \
            /usr/local/libexec/autostream-hostruntime-docker.test
          sudo install -d -o root -g root -m 0700 \
            "${RUNNER_TEMP}/docker-root-tmp"
      - name: Run exact Docker daemon and transaction tests once
        id: daemon
        shell: bash
        run: |
          set -euo pipefail
          pattern="$(paste -sd '|' scripts/ci/required-docker-tests.txt)"
          evidence="${RUNNER_TEMP}/docker-restart-diagnostics/daemon/docker.json"
          set +e
          sudo /usr/bin/unshare --mount --propagation private \
            /usr/bin/env -i \
              AUTOSTREAM_DOCKER_PORT_DAEMON_SMOKE=1 \
              AUTOSTREAM_DOCKER_PORT_DAEMON_SMOKE_MOUNT_NS=1 \
              AUTOSTREAM_DOCKER_PORT_FIXTURE_BINARY=/usr/local/libexec/autostream-docker-port-fixture-ci \
              HOME=/root \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              TMPDIR="${RUNNER_TEMP}/docker-root-tmp" \
              TZ=UTC \
              /usr/local/libexec/autostream-hostruntime-docker.test \
                -test.v=test2json \
                -test.run "^(${pattern})$" \
                -test.count=1 \
                -test.timeout=20m \
            2>&1 |
            go tool test2json -t \
              -p github.com/Kome-Lab/Autostream-Updater/internal/hostruntime \
              > "${evidence}"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          [[ ${pipeline_status[0]} -eq 0 && ${pipeline_status[1]} -eq 0 ]]
      - name: Require exact Docker run/pass evidence and skip zero
        if: always() && steps.source-guard.outcome == 'success' && steps.daemon.outcome != 'skipped'
        shell: bash
        run: |
          bash scripts/ci/verify-go-test-evidence.sh \
            "${RUNNER_TEMP}/docker-restart-diagnostics/daemon" \
            "${GITHUB_WORKSPACE}/historical-source/internal/hostruntime" \
            scripts/ci/required-docker-tests.txt
      - name: Record diagnostic-only provenance even on failure
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "docker-restart-diagnostics"
          evidence.mkdir(parents=True, exist_ok=True)
          guard_path = evidence / "source-guard.json"
          guard = {"status": "not_run"}
          if guard_path.is_file():
              guard = json.loads(guard_path.read_text(encoding="utf-8"))
          binaries = {}
          for label, name in (("test_binary_sha256", "hostruntime-docker.test"), ("fixture_binary_sha256", "docker-port-fixture")):
              path = Path(os.environ["RUNNER_TEMP"]) / name
              binaries[label] = None
              if path.is_file():
                  with path.open("rb") as binary:
                      binaries[label] = hashlib.file_digest(binary, "sha256").hexdigest()
          provenance = {
              "purpose": "fixed_historical_diagnostic_reproduction",
              "U_APP": os.environ["U_APP"],
              "B_WORKFLOW": os.environ["B_WORKFLOW"],
              "D_PREVIOUS": os.environ["D_PREVIOUS"],
              "W_BASE": os.environ["W_BASE"],
              "source_sha": os.environ["HISTORICAL_SOURCE_SHA"],
              "historical_workflow_sha": os.environ["HISTORICAL_SOURCE_SHA"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["DIAGNOSTIC_WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_guard": guard,
              **binaries,
          }
          (evidence / "provenance.json").write_text(json.dumps(provenance, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-docker-restart-diagnostics-ca8bc7a6-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-restart-diagnostics/
          if-no-files-found: error
          retention-days: 14
