name: C10 canonical evidence promotion verification
on:
  pull_request:
    branches: [v3-dev]
permissions:
  contents: read
concurrency:
  group: c10-evidence-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  promotion-scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Acquire reviewed public module and format changed sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          GOFLAGS=-mod=mod bash scripts/ci/verify-v3-evidence-module.sh
          go mod edit -fmt
          files=(
            internal/localexecutor/registry/guard_contracts.go
            internal/localexecutor/registry/guard_contracts_test.go
            internal/localexecutor/registry/guard_evidence.go
          )
          gofmt -w "${files[@]}"
          files+=(go.mod go.sum)
          for file in "${files[@]}"; do
            printf '\n__C10_PROMOTION_FILE_BEGIN__%s\n' "$file"
            cat "$file"
            printf '\n__C10_PROMOTION_FILE_END__\n'
          done
      - name: Test native C10 contract interoperability
        run: go test -p 1 -count=1 -v -run '^TestSQLiteContracts' ./internal/localexecutor/registry
      - name: Vet Registry
        run: go vet -p 1 ./internal/localexecutor/registry
      - name: Preserve production source boundary
        run: go test -p 1 ./internal/boundary
