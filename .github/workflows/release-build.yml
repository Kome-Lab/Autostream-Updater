name: Publish versioned release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: updater-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOMAXPROCS: "2"
  GOTOOLCHAIN: local

jobs:
  build:
    name: Verify tag, wait for exact CI, build once, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Require GitHub-hosted runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require immutable stable tag and absent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${TAG_CREATED}" = true
          test "${TAG_FORCED}" = false
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf '%s\n' 'release tag must be a stable vX.Y.Z tag' >&2
            exit 1
          }
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/ci/verify-github-release-tag.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'GitHub Release already exists and will not be overwritten: %s\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Require successful CI for this exact tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/wait-for-exact-ci-success.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" 1800
      - name: Resolve immutable build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u -d "@$(git show -s --format=%ct "${GITHUB_SHA}")" +%Y-%m-%dT%H:%M:%SZ)"
          artifact_name="autostream-updater-${GITHUB_REF_NAME}-${GITHUB_SHA}"
          printf 'version=%s\n' "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          printf 'build_date=%s\n' "${build_date}" >> "${GITHUB_OUTPUT}"
          printf 'artifact_name=%s\n' "${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Build Linux amd64 and arm64 bundles once
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          bash scripts/ci/build-release-bundles.sh \
            "${VERSION}" "${GITHUB_SHA}" "${BUILD_DATE}" \
            "${RUNNER_TEMP}/release-artifacts"
      - name: Verify manifests and every checksum layer
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/ci/verify-release-bundles.sh \
            "${RUNNER_TEMP}/release-artifacts" \
            "${VERSION}" "${GITHUB_SHA}"
      - name: Attest runtime manifest as one exact subject
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ runner.temp }}/release-artifacts/host-agent-manifest.json.sha256
      - name: Attest every release file
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/release-artifacts/*
      - name: Upload exact release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Reverify and publish immutable GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download exact build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts
      - name: Reverify tag, absent release, manifests, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test "${VERSION}" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          bash scripts/ci/verify-github-release-tag.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'GitHub Release already exists and will not be overwritten: %s\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          bash scripts/ci/verify-release-bundles.sh \
            artifacts "${VERSION}" "${GITHUB_SHA}"
      - name: Publish GitHub Release without tag mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "AutoStream Updater ${GITHUB_REF_NAME}" \
            --notes "Immutable AutoStream Updater release for commit ${GITHUB_SHA}. No production deployment is performed by this workflow."
