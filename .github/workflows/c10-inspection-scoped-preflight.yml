name: C10 Lifecycle Inspection scoped preflight
on:
  push:
    branches: [codex/c10-sqlite-read-20261111]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  inspection-scoped-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Format scoped Go sources
        run: gofmt -w internal/localexecutor/registry/sqlite_owner.go internal/localexecutor/registry/sqlite_inspection.go internal/localexecutor/registry/sqlite_header_probe.go internal/localexecutor/registry/sqlite_header_probe_linux.go internal/localexecutor/registry/sqlite_header_probe_other.go internal/localexecutor/registry/sqlite_inspection_test.go
      - name: Capture formatted source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=["sqlite_owner.go","sqlite_inspection.go","sqlite_header_probe.go","sqlite_header_probe_linux.go","sqlite_header_probe_other.go","sqlite_inspection_test.go"]
          for name in names:
              path='internal/localexecutor/registry/'+name
              print('INSPECTION_FORMATTED_FILE='+json.dumps({'path':path,'content':Path(path).read_text()},ensure_ascii=True))
          PY
      - name: Run synthetic SQLite and Inspection tests without CGO
        run: CGO_ENABLED=0 go test -p 1 -count=1 -v -run '^TestSQLite' ./internal/localexecutor/registry
      - name: Vet registry
        run: go vet -p 1 ./internal/localexecutor/registry
