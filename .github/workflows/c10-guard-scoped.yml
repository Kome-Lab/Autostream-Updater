name: C10 Guard scoped verification
on:
  pull_request:
    branches: [v3-dev]
permissions:
  contents: read
concurrency:
  group: c10-guard-scoped-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  guard-scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Format changed Guard sources and emit reviewed content
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          files=(
            internal/localexecutor/registry/guard_evidence.go
            internal/localexecutor/registry/guard_evidence_test.go
            internal/localexecutor/registry/local_identity.go
            internal/localexecutor/registry/local_identity_linux.go
            internal/localexecutor/registry/local_identity_other.go
            internal/localexecutor/registry/local_identity_linux_test.go
            internal/localexecutor/registry/preflight.go
          )
          gofmt -w "${files[@]}"
          for file in "${files[@]}"; do
            printf '\n__AUTOSTREAM_GUARD_FORMAT_BEGIN__%s\n' "$file"
            cat "$file"
            printf '\n__AUTOSTREAM_GUARD_FORMAT_END__\n'
          done
      - name: Run new Guard adapter and local identity tests
        run: go test -p 1 -count=1 -v -run '^TestSQLiteGuard' ./internal/localexecutor/registry
      - name: Vet Registry
        run: go vet -p 1 ./internal/localexecutor/registry
      - name: Preserve production source boundary
        run: go test -p 1 ./internal/boundary
      - name: Preserve module files
        run: git diff --exit-code -- go.mod go.sum
