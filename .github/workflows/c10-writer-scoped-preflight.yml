name: C10 Writer scoped preflight
on:
  pull_request:
    branches: [v3-dev]
permissions:
  contents: read
concurrency:
  group: c10-writer-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  writer-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Format changed Go sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          go version
          gofmt -w internal/localexecutor/registry/sqlite_owner.go internal/localexecutor/registry/sqlite_roles.go internal/localexecutor/registry/sqlite_inspection.go internal/localexecutor/registry/sqlite_writer_test.go
          python3 - <<'PY'
          import json
          for path in ["internal/localexecutor/registry/sqlite_owner.go", "internal/localexecutor/registry/sqlite_roles.go", "internal/localexecutor/registry/sqlite_inspection.go", "internal/localexecutor/registry/sqlite_writer_test.go"]:
              print("WRITER_FORMATTED_FILE=" + json.dumps({"path": path, "content": open(path).read()}, separators=(",", ":")))
          PY
      - name: Test new Writer profile and admission only
        run: CGO_ENABLED=0 go test -p 1 -v -count=1 -run '^TestSQLiteWriter' ./internal/localexecutor/registry
      - name: Verify dependency files
        run: git diff --exit-code -- go.mod go.sum
