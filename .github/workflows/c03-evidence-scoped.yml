name: C03 evidence candidate scoped verification
on:
  pull_request:
    branches: [v3-dev]
permissions:
  contents: read
concurrency:
  group: c03-evidence-scoped-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  candidate-scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Format unapplied candidate files and emit reviewed content
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          files=(
            testdata/c03-contracts-candidate/contracts/v3evidence/types.go
            testdata/c03-contracts-candidate/contracts/v3evidence/codec.go
            testdata/c03-contracts-candidate/contracts/v3evidence/codec_test.go
            testdata/c03-contracts-candidate/updater/guard_contracts.go
            testdata/c03-contracts-candidate/updater/guard_contracts_test.go
          )
          gofmt -w "${files[@]}"
          for file in "${files[@]}"; do
            printf '\n__C03_CANDIDATE_FORMAT_BEGIN__%s\n' "$file"
            cat "$file"
            printf '\n__C03_CANDIDATE_FORMAT_END__\n'
          done
      - name: Check candidate harness syntax
        run: bash -n scripts/ci/verify-c03-evidence-candidate.sh
      - name: Run candidate contract and interoperability tests
        run: bash scripts/ci/verify-c03-evidence-candidate.sh focused
      - name: Preserve production source boundary
        run: go test -p 1 ./internal/boundary
      - name: Preserve product dependency files
        run: git diff --exit-code -- go.mod go.sum
