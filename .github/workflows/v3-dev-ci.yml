name: v3-dev Go CI

on:
  push:
    branches: [v3-dev]
  pull_request:
    branches: [v3-dev]

permissions:
  contents: read

concurrency:
  group: v3-dev-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  v3-go-checks:
    name: v3-go-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify Go version
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          test "$(awk '$1 == "go" { print $2 }' go.mod)" = 1.26.5
          go version
      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          test "${#go_files[@]}" -gt 0
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Test all Go packages
        run: go test -p 1 ./...
      - name: Vet all Go packages
        run: go vet -p 1 ./...
      - name: Build existing Go entrypoints
        run: go build -p 1 ./cmd/autostream-updater-agent ./cmd/autostream-local-executor
      - name: Verify module files unchanged
        run: git diff --exit-code -- go.mod go.sum
