name: v3-dev Go CI

on:
  push:
    branches: [v3-dev]
  pull_request:
    branches: [v3-dev]

permissions:
  contents: read

concurrency:
  group: v3-dev-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  v3-go-checks:
    name: v3-go-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify Go version
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          test "$(awk '$1 == "go" { print $2 }' go.mod)" = 1.26.5
          go version
      - name: Verify pinned Contracts evidence source
        run: bash scripts/ci/verify-v3-evidence-module.sh
      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          test "${#go_files[@]}" -gt 0
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Test all Go packages
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 -count=1 -json ./... | tee "${RUNNER_TEMP}/v3-tests.json"
      - name: Require canonical adapter test execution
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r required; do
            test -n "$required" || continue
            test "$(jq -sr --arg name "$required" '[.[]|select(.Test==$name and .Action=="run")]|length' "${RUNNER_TEMP}/v3-tests.json")" = 1
            test "$(jq -sr --arg name "$required" '[.[]|select(.Test==$name and .Action=="pass")]|length' "${RUNNER_TEMP}/v3-tests.json")" = 1
            test "$(jq -sr --arg name "$required" '[.[]|select(.Test==$name and (.Action=="skip" or .Action=="fail"))]|length' "${RUNNER_TEMP}/v3-tests.json")" = 0
          done < scripts/ci/c10-canonical-required-tests.txt
      - name: Vet all Go packages
        run: go vet -p 1 ./...
      - name: Build existing Go entrypoints
        run: go build -p 1 ./cmd/autostream-updater-agent ./cmd/autostream-local-executor
      - name: Test SQLite and canonical adapter without CGO
        run: CGO_ENABLED=0 go test -p 1 -count=1 -run '^Test(SQLite|CanonicalAdapter|Validation)' ./internal/localexecutor/registry
      - name: Race-test SQLite and canonical adapter
        run: CGO_ENABLED=1 go test -race -p 1 -count=1 -run '^Test(SQLite|CanonicalAdapter|Validation)' ./internal/localexecutor/registry
      - name: Cross-build CGO-free Linux entrypoints and registry
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -p 1 -trimpath ./cmd/autostream-updater-agent ./cmd/autostream-local-executor
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go test -p 1 -trimpath -c ./internal/localexecutor/registry -o "${RUNNER_TEMP}/registry-linux-${arch}.test"
            go version -m "${RUNNER_TEMP}/registry-linux-${arch}.test"
            sha256sum "${RUNNER_TEMP}/registry-linux-${arch}.test"
          done
      - name: Checkout fixed pre-adapter C10 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Updater
          ref: 6f71ee3a0906665f0a639abf69c27749ba211dc7
          path: .c10-baseline
          persist-credentials: false
      - name: Read actual old SQLite records with candidate
        run: bash scripts/ci/c10_baseline_records.sh
      - name: Checkout fixed CP product resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-ControlPanel
          ref: d8ff3362ab29780a9fe605eb260b13293d09abe9
          path: .c10-interop-cp
          persist-credentials: false
      - name: Candidate C10 to fixed CP product resolver and back
        run: bash scripts/ci/c10-cp-interop.sh
      - name: Verify module files unchanged
        run: git diff --exit-code -- go.mod go.sum
